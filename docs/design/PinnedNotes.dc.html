<!doctype html>
<html lang="en">
<head>

<title>Pinned notes on the desktop</title>

<x-dc>
<helmet><style>body{margin:0}.sticky .tt{font-size:15px;font-weight:700;margin-bottom:6px}.sticky .bd{font-size:13px;line-height:1.55}.hud{display:flex;gap:2px;align-items:center;height:26px;margin:-6px -7px 8px;padding:0 4px;border-radius:8px;background:rgba(0,0,0,.09)}.hud button{width:26px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:#3A3A3C}.hud button.on{background:rgba(0,0,0,.14);color:#000}.drive{position:absolute;right:30px;width:72px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;color:#fff}.drive span.b{width:56px;height:46px;border-radius:8px;background:#C9CDD3;display:block}</style></helmet>
<div class="scene" style="width:1080px;height:680px">
<div class="menubar"><div class="l"><b>Finder</b><span>File</span><span>Edit</span><span>View</span></div><div class="r num"><span>Sat 31 Oct 14:32</span></div></div>
<div class="hwnotch"></div>
<div class="drive" style="top:60px"><span class="b"></span>Macintosh HD</div>
<div class="drive" style="top:150px"><span class="b" style="background:#6CA4E8"></span>Projects</div>

<div class="sticky" style="left:760px;top:190px;width:270px;height:210px;background:#B9F0C4;box-shadow:0 22px 50px rgba(0,0,0,.45)">
<div class="hud"><button type="button" aria-label="On desktop"><span class="i i-display sm" aria-hidden="true"></span></button><button class="on" type="button" aria-label="Always on top"><span class="i i-pin sm" aria-hidden="true"></span></button><button type="button" aria-label="Back to notch" style="margin-left:auto"><span class="i i-up sm" aria-hidden="true"></span></button></div>

</div>
