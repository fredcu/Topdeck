<div class="scene" style="width:1080px;height:580px">

<div class="card col" style="justify-content:space-between"><div class="row between" style="align-items:baseline"><span class="q">CPU</span><span class="d2">34%</span></div><div class="cores"><span class="e" style="height:30%"></span><span class="e" style="height:22%"></span><span class="e" style="height:40%"></span><span class="e" style="height:18%"></span><span style="height:82%"></span><span style="height:64%"></span><span style="height:48%"></span><span style="height:30%"></span><span style="height:54%"></span><span style="height:12%"></span></div></div>
