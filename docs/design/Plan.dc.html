<div class="body">
<div class="card" style="flex:1.2;padding:6px 14px">
<div class="ev"><span class="m num">15:00</span><span class="b" style="background:var(--sig)"></span><div class="col" style="gap:1px"><span class="t">Design review</span><span class="q">in 28 minutes</span></div><button class="btn a" type="button">Join</button></div>
<div class="sep"></div>
<div class="ev"><span class="m num">16:30</span><span class="b" style="background:#6CB2FF"></span><div class="col" style="gap:1px"><span class="t">Pick up from swimming</span><span class="q">Bondi</span></div><span></span></div>
<div class="sep"></div>
<div class="ev"><span class="m num">19:00</span><span class="b" style="background:#32D74B"></span><div class="col" style="gap:1px"><span class="t">Dinner with Sam</span><span class="q">The Grounds</span></div><span></span></div>
</div>
<div class="col" style="flex:1;padding:4px 6px;gap:0">
<div class="tk"><span class="cb"></span><span class="s grow ell">Pay rent</span><span class="q" style="color:var(--sig)">Today</span></div>
<div class="tk"><span class="cb"></span><span class="s grow ell">Renew domain</span><span class="q">Mon</span></div>
<div class="tk"><span class="cb"></span><span class="s grow ell">Review icon</span><span class="q">Tue</span></div>
<div class="tk"><span class="cb" style="background:var(--t3);box-shadow:none"><span class="i i-check sm" aria-hidden="true"></span></span><span class="q grow ell" style="text-decoration:line-through">Book dentist</span></div>
<div class="tk"><span class="cb"></span><span class="s grow ell">交学校表格</span><span class="q">Wed</span></div>

</div>
</div>
