<helmet><style>body{margin:0}:root{--ink:#10131B;--card:#1A1F2B;--card2:#232936;--card3:#2E3545;--line:rgba(190,205,235,.11);--t1:#F3F5FA;--t2:#B7BFD0;--t3:#8791A6;
--now:#6CB2FF;--shelf:#3FD6C5;--clip:#B49CFF;--tools:#FF9F5A;--agents:#FFB340;--mac:#5EDB8A}
.scene{background:#39465A}.deck{background:linear-gradient(180deg,#000 0,#000 37px,#10131B 92px,#10131B 100%)}
.nav{color:#A4AEC2}.nav.on{color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent)}
.tile{background:var(--card2);border-radius:12px}.c{font-family:var(--mono)}
.ch{font-size:12px;font-weight:600;color:var(--t2)}.pill{height:24px;padding:0 9px;border-radius:999px;background:var(--card2);font-size:12px;font-weight:600;color:var(--t2);display:inline-flex;align-items:center;gap:5px;flex:none}.pill.on{background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c)}
.go{height:30px;padding:0 12px;border-radius:9px;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;flex:none}
.spark{display:block;width:100%}.gb{display:grid;gap:10px}.mt{font-family:var(--round);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1;color:var(--t1)}
.ico{width:26px;height:26px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;flex:none;background:color-mix(in srgb,var(--k) 20%,transparent);color:var(--k)}.ico svg{width:15px;height:15px}
.bar3{height:5px;border-radius:3px;background:var(--card3);overflow:hidden;display:block}.bar3 i{display:block;height:100%;border-radius:3px;background:var(--k)}
.bodyp{flex:1;min-height:0;padding:0 16px 14px;display:flex;gap:10px}</style></helmet>

"position:relative;height:12px"><span style="position:absolute;left:30%;width:18%;top:0;bottom:0;border-radius:4px;background:color-mix(in srgb,var(--clip) 55%,transparent)"></span><span style="position:absolute;left:62%;width:12%;top:0;bottom:0;border-radius:4px;background:color-mix(in srgb,var(--clip) 55%,transparent)"></span></div></div></div>
</div>
