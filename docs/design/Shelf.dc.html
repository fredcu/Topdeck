<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stash: Shelf</title>
<link rel="stylesheet" href="deck.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}.fi{width:104px;display:flex;flex-direction:column;align-items:center;gap:8px;flex:none}.thumb{width:84px;height:84px;border-radius:12px;background:var(--card2);display:flex;align-items:center;justify-content:center;color:var(--t2)}.fi .s{width:100%;text-align:center}</style></helmet>
<div class="scene" style="width:1080px;height:580px">
<div class="fake" style="left:70px;top:90px;width:940px;height:440px"></div>
<div class="menubar"><div class="l"><b>Finder</b><span>File</span><span>Edit</span></div><div class="r num"><span>Sat 31 Oct 14:32</span></div></div>
<div class="deck" style="width:700px;height:360px;margin-left:-350px">
<div class="wings"><div class="wing"><button class="nav" type="button">Now</button><button class="nav on" type="button">Stash</button><button class="nav" type="button">Plan</button></div><div></div><div class="wing r"><button class="nav" type="button">Agents</button><button class="nav" type="button">Mac</button><button class="nav" type="button">Tools</button></div></div>
<div class="sub"><div class="subt"><button class="on" type="button">Shelf</button><button type="button">Clipboard</button><button type="button">Notes</button></div><div class="tools"><button class="ib" type="button" aria-label="AirDrop all"><span class="i i-share" aria-hidden="true"></span></button><button class="ib" type="button" aria-label="Clear"><span class="i i-trash" aria-hidden="true"></span></button></div></div>
<div class="body" style="flex-direction:column">
<div class="card f" style="padding:20px 16px;display:flex;gap:10px;overflow:hidden">
<div class="fi"><div class="thumb" style="background:#27415E"><span class="i i-image xl" aria-hidden="true"></span></div><div class="s ell">hero.png</div></div>
<div class="fi"><div class="thumb"><span class="i i-file xl" aria-hidden="true"></span></div><div class="s ell">Invoice.pdf</div></div>
<div class="fi"><div class="thumb"><span class="i i-file xl" aria-hidden="true"></span></div><div class="s ell">design-v2.md</div></div>
<div class="fi"><div class="thumb" style="background:#3C2E22"><span class="i i-image xl" aria-hidden="true"></span></div><div class="s ell">Screenshot 14.03</div></div>
<div class="fi"><div class="thumb"><span class="i i-file xl" aria-hidden="true"></span></div><div class="s ell">Topdeck.zip</div></div>
<div class="fi"><div class="thumb" style="box-shadow:inset 0 0 0 1.5px var(--line);background:none;color:var(--t3)"><span class="i i-plus lg" aria-hidden="true"></span></div><div class="q">Drop</div></div>
</div>
<div class="row between" style="padding:0 6px;height:28px"><span class="q num">5 items</span><span class="row" style="gap:6px;color:var(--go)"><span class="i i-check sm" aria-hidden="true"></span><span class="m">Link copied</span></span></div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1080,"height":580}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
