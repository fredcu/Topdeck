<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Command bar</title>
<link rel="stylesheet" href="deck.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}.bar2{position:absolute;left:50%;top:120px;width:640px;margin-left:-320px;background:#121214;border-radius:18px;box-shadow:0 34px 90px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.1);overflow:hidden}.q2{height:60px;padding:0 20px;display:flex;align-items:center;gap:12px;font-size:20px;color:var(--t1)}.res{padding:6px}.res .it{min-height:46px;padding:0 12px}.ic{width:28px;height:28px;border-radius:7px;background:var(--card3);display:inline-flex;align-items:center;justify-content:center;flex:none}.foot{height:38px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;background:#0C0C0E}</style></helmet>
<div class="scene" style="width:1080px;height:680px">
<div class="fake" style="left:70px;top:70px;width:940px;height:550px"></div>
<div class="menubar"><div class="l"><b>Safari</b><span>File</span><span>Edit</span></div><div class="r num"><span>Sat 31 Oct 14:32</span></div></div>
<div class="hwnotch"></div>
<div class="bar2">
<div class="q2"><span class="i i-search lg" style="color:var(--t3)" aria-hidden="true"></span><span>left half</span><span style="width:2px;height:24px;background:var(--sig);margin-left:-9px"></span></div>
<div class="sep"></div>
<div class="res">
<div class="it on"><span class="ic"><span class="i i-rect" aria-hidden="true"></span></span><span class="t grow">Left Half</span><span class="q">Window</span><span class="kbd">⌃⌥←</span></div>
<div class="it"><span class="ic"><span class="i i-rect" aria-hidden="true"></span></span><span class="s grow">Left Two Thirds</span><span class="q">Window</span></div>
<div class="it"><span class="ic" style="background:#3478F6"><span class="i i-app" aria-hidden="true"></span></span><span class="s grow">Xcode</span><span class="q">App</span></div>
<div class="it"><span class="ic"><span class="i i-note" aria-hidden="true"></span></span><span class="s grow">Open Notes</span><span class="q">Stash</span></div>
<div class="it"><span class="ic"><span class="i i-gear" aria-hidden="true"></span></span><span class="s grow">Windows Settings</span><span class="q">Settings</span></div>
</div>
<div class="foot"><span class="q">5 results</span><div class="row" style="gap:6px"><span class="m">Run</span><span class="kbd">↩</span></div></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1080,"height":680}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
