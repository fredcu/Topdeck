<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tools</title>
<link rel="stylesheet" href="deck.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}.tool{height:62px;border-radius:12px;background:var(--card2);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:10px 11px;text-align:left}.tool span.l{font-size:12px;font-weight:600}.pre{height:27px;padding:0 10px;border-radius:999px;background:var(--card3);font-size:12px;font-weight:600}.sw{width:18px;height:18px;border-radius:50%;display:block}</style></helmet>
<div class="scene" style="width:1080px;height:580px">
<div class="fake" style="left:70px;top:90px;width:940px;height:440px"></div>
<div class="menubar"><div class="l"><b>Figma</b><span>File</span><span>Edit</span></div><div class="r num"><span>Sat 31 Oct 14:32</span></div></div>
<div class="deck" style="width:700px;height:430px;margin-left:-350px">
<div class="wings"><div class="wing"><button class="nav" type="button">Now</button><button class="nav" type="button">Stash</button><button class="nav" type="button">Plan</button></div><div></div><div class="wing r"><button class="nav" type="button">Agents</button><button class="nav" type="button">Mac</button><button class="nav on" type="button">Tools</button></div></div>
<div class="sub"><div class="h">Tools</div></div>
<div class="body">
<div class="col" style="flex:1.2;gap:10px">
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
<button class="tool" type="button"><span class="i i-camera" aria-hidden="true"></span><span class="l">Screenshot</span></button>
<button class="tool" type="button"><span class="i i-scroll" aria-hidden="true"></span><span class="l">Scrolling</span></button>
<button class="tool" type="button"><span class="i i-pin" aria-hidden="true"></span><span class="l">Pin Image</span></button>
<button class="tool" type="button"><span class="i i-text" aria-hidden="true"></span><span class="l">Copy Text</span></button>
<button class="tool" type="button"><span class="i i-qr" aria-hidden="true"></span><span class="l">QR Code</span></button>
<button class="tool" type="button"><span class="i i-drop" aria-hidden="true"></span><span class="l">Color</span></button>
</div>
<div class="card col f" style="justify-content:center;gap:10px;padding:12px 14px">
<div class="row between"><span class="s">Colors</span><button class="ib" type="button" style="width:24px;height:24px" aria-label="Clear colors"><span class="i i-x sm" aria-hidden="true"></span></button></div>
<div class="row" style="gap:10px"><span class="sw" style="background:#FFB340"></span><span class="sw" style="background:#3B82F6"></span><span class="sw" style="background:#FC3C44"></span><span class="sw" style="background:#34C759"></span><span class="c" style="margin-left:auto">#FFB340</span></div>
</div>
<div class="row"><button class="btn" type="button" style="flex:1"><span class="i i-stack sm" aria-hidden="true"></span>Shortcuts</button><button class="btn" type="button" style="flex:1"><span class="i i-moon sm" aria-hidden="true"></span>Sleep Displays</button></div>
</div>
<div class="col" style="flex:1;gap:10px">
<div class="card col f" style="justify-content:space-between">
<div class="row between"><span class="q">Timer</span><button class="ib" type="button" style="width:26px;height:26px" aria-label="Stopwatch"><span class="i i-clock sm" aria-hidden="true"></span></button></div>
<div class="d">24:58</div>
<div class="row"><button class="btn p" type="button" style="flex:1">Pause</button><button class="btn" type="button">+1</button></div>
</div>
<div class="card col" style="gap:10px;padding:12px 14px">
<div class="row between"><span class="s">Keep Awake</span><span class="m num">1:12 left</span></div>
<div class="row" style="gap:6px"><button class="pre" type="button">30m</button><button class="pre" type="button">1h</button><button class="pre" type="button">2h</button><button class="pre" type="button">∞</button><button class="btn" type="button" style="height:27px;margin-left:auto;background:var(--t1);color:#000">Off</button></div>
</div>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1080,"height":580}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
