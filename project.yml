# XcodeGen spec for the app targets. Topdeck.xcodeproj is generated from this
# file and git-ignored: run `make project` (or `xcodegen generate`).
name: Topdeck
options:
  bundleIdPrefix: net.icuai.topdeck
  deploymentTarget:
    macOS: "14.6"
  createIntermediateGroups: true
packages:
  TopdeckKit:
    path: .

settingGroups:
  app:
    # The app's name everywhere people see it: Topdeck.app, the menu bar, Settings, permission
    # prompts. The project, targets, and bundle ID keep their original Topdeck names.
    PRODUCT_NAME: Topdeck
    PRODUCT_BUNDLE_IDENTIFIER: net.icuai.topdeck
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "6.0" # Swift 6 language mode: complete strict-concurrency checking
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_LSUIElement: YES # accessory app: no Dock icon, no menu bar
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
    INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026 Fred Cao. MIT License. Built on ILoveNotch by Niyam Vora.
    # Shelf files dropped from protected folders are checked again on later launches.
    INFOPLIST_KEY_NSDesktopFolderUsageDescription: Topdeck keeps files you drop on the shelf so you can drag them out later.
    INFOPLIST_KEY_NSDocumentsFolderUsageDescription: Topdeck keeps files you drop on the shelf so you can drag them out later.
    INFOPLIST_KEY_NSDownloadsFolderUsageDescription: Topdeck keeps files you drop on the shelf so you can drag them out later.
    INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: Topdeck shows today's events in the notch, adds the events and time blocks you create there, and changes or deletes the ones you choose. Your calendars stay on this Mac.
    INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: Topdeck shows, adds, and completes your reminders in the notch.
    ENABLE_HARDENED_RUNTIME: YES
    # Ad-hoc signing builds and runs without an Apple team; `make` signs local builds with an Apple
    # Development certificate when there is one, and releases are re-signed when they're exported.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""

targets:
  # The app.
  Topdeck:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: ["Info.plist"]
      # Now-playing helper script, run by /usr/bin/perl (see THIRD_PARTY_NOTICES.md).
      - path: ThirdParty/mediaremote-adapter/bin/mediaremote-adapter.pl
        buildPhase: resources
      # The licenses of the code this edition ships, which they ask to travel with it.
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      - package: TopdeckKit
        product: TopdeckCore
      - package: TopdeckKit
        product: TopdeckSurface
      - package: TopdeckKit
        product: TopdeckFeatures
      - package: TopdeckKit
        product: TopdeckUsage
      - package: TopdeckKit
        product: TopdeckMixer
      # Embedded, never linked: the framework is loaded by the perl helper process, not by Topdeck.
      - target: MediaRemoteAdapter
        embed: true
        link: false
    settings:
      groups: [app]
      base:
        # Merged with the generated keys: the checkout and commit a local build came from.
        INFOPLIST_FILE: App/Info.plist
        # Release builds set this empty, so downloads never carry a path from the build machine.
        TOPDECK_SOURCE: $(SRCROOT)
        # Hardened Runtime resource access: EventKit, the camera, and system audio.
        CODE_SIGN_ENTITLEMENTS: App/Topdeck.entitlements

  # mediaremote-adapter (BSD-3-Clause, git submodule pinned to v0.7.7), built the way its
  # CMakeLists.txt does: Objective-C with ARC and default symbol visibility so perl can call it.
  MediaRemoteAdapter:
    type: framework
    platform: macOS
    sources:
      - path: ThirdParty/mediaremote-adapter/src
        excludes: ["test/**"]
      - path: ThirdParty/mediaremote-adapter/include
        headerVisibility: public
    dependencies:
      - sdk: Foundation.framework
      - sdk: AppKit.framework
      - sdk: UniformTypeIdentifiers.framework
    settings:
      base:
        PRODUCT_NAME: MediaRemoteAdapter
        PRODUCT_BUNDLE_IDENTIFIER: com.vandenbe.MediaRemoteAdapter
        MARKETING_VERSION: 0.7.7
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        CLANG_ENABLE_OBJC_ARC: YES
        GCC_SYMBOLS_PRIVATE_EXTERN: NO
        GCC_WARN_INHIBIT_ALL_WARNINGS: YES # vendored code: its warnings are upstream's to fix
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/ThirdParty/mediaremote-adapter/include", "$(SRCROOT)/ThirdParty/mediaremote-adapter/src"]
        DEFINES_MODULE: NO
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""

schemes:
  Topdeck:
    build:
      targets:
        Topdeck: all
    test:
      config: Debug
      targets:
        - package: TopdeckKit/TopdeckCoreTests
        - package: TopdeckKit/TopdeckSurfaceTests
        - package: TopdeckKit/TopdeckFeaturesTests
        - package: TopdeckKit/PerformanceTests
    archive:
      config: Release
